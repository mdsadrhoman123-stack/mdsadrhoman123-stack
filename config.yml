ascii_file: "art.txt"        # রেডি ASCII আর্ট হুবহু এখান থেকে বসে (খালি রাখলে ছবি থেকে বানাবে)
ascii_scale: 1.0             # ১.০ = আর্টের উচ্চতা ডান পাশের টেক্সটের সমান; বড় চাইলে বাড়ান

