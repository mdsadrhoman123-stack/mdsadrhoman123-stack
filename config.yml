ascii_width: 44              # কত ক্যারেক্টার চওড়া (রেফারেন্সে ৪৪)
char_ratio: 0.53             # লম্বা/চওড়ার অনুপাত (কম দিলে ছবি চ্যাপ্টা হয়)
invert_ascii: false          # গাঢ় জায়গা ঘন অক্ষরে আঁকা হয়; উল্টো চাইলে true
remove_background: true      # এক রঙের ব্যাকগ্রাউন্ড মুছে দেয় (রেফারেন্সের মতো)
