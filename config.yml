# about.svg — **...** দিলে লেখাটা bold হবে
about_title: "about"
about: >-
  Sayad is an **AI Automation Engineer and consultant** working with n8n, AI agents, RAG pipelines
  and CRM automation. He builds production systems for teams in **Real Estate, E-commerce,
  Solar & Field Service and M&A Advisory** — currently expanding into Healthcare & Dental —
  white-label for agencies and directly with founders. His builds ship with explicit
  **error handling, retry logic, SLA tracking and audit trails** from day one, because most
  automation does not fail with an alarm: it fails silently. To date **20+ production systems**
  delivered, cutting manual work by **~60% on average**. Open worldwide for remote freelance and
  white-label projects.

