name: Update profile card

on:
  schedule:
    - cron: "30 5 * * *"   # প্রতিদিন UTC 05:30 = বাংলাদেশ সময় সকাল ১১:৩০
  workflow_dispatch:        # চাইলে হাতে চালানো যাবে
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg activity.svg cache
          git diff --staged --quiet || git commit -m "chore: update profile card"
          git push
